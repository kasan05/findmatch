spring.application.name=findmatch
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
#spring.datasource.url=jdbc:mysql://localhost:3306/matrimony
spring.jpa.hibernate.ddl-auto=update
spring.threads.virtual.enabled=true
spring.jpa.show-sql=false
# Set the maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=20MB
# Set the maximum total request size allowed for multipart/form-data
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.resolve-lazily=true
resilience4j.bulkhead.instances.getBrokerService.maxConcurrentCalls=5
resilience4j.ratelimiter.instances.getBrokerService.limitForPeriod=20
resilience4j.ratelimiter.instances.getBrokerService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.getBrokerService.timeoutDuration=0
resilience4j.bulkhead.instances.getBrokerService.maxWaitDuration=0
#management.tracing.sampling.probability=0.1
#management.observations.annotations.enabled=true
#management.otlp.metrics.export.enabled=true
#management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
#management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
#management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
server.shutdown=IMMEDIATE
spring.docker.compose.enabled=false
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
aws.s3.bucket-name.verification=${BUCK_NAME_VERIFICATION}
aws.s3.bucket-name.photos=${BUCK_NAME}
aws.s3.region=ap-south-1
aws.access-key-id=${AWS_ACCESS_KEY}
aws.secret-access-key=${AWS_SECRET_KEY}
spring.cache